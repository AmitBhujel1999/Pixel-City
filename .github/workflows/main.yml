          base64 -d ks.b64 > android/app/pixels-city.keystore
          grep applicationId android/app/build.gradle
          grep app_name android/app/src/main/res/values/strings.xml

      - name: Build the APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PixelsCity.apk

      - name: Save the APK with this run
        uses: actions/upload-artifact@v5
        with:
          name: PixelsCity-apk
          path: PixelsCity.apk

      - name: Publish a download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pixels-city-${{ github.run_number }}
          name: Pixel's City build ${{ github.run_number }}
          body: Download PixelsCity.apk on your Android phone and open it to install. It installs next to the old Pixel City app.
          files: PixelsCity.apk
