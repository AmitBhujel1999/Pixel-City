name: Build Pixel's City APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install app dependencies
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Name the app Pixel's City and sign it with the permanent key
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/res/values/strings.xml'; s=open(p).read()
          s=re.sub(r'(<string name="(?:app_name|title_activity_main)">)[^<]*(</string>)', lambda m: m.group(1)+"Pixel\\'s City"+m.group(2), s)
          open(p,'w').write(s)
          p='android/app/build.gradle'; s=open(p).read()
          s=s.replace('applicationId "com.ameet.pixelcity"','applicationId "com.ameet.pixelscity"')
          s+="\nandroid { signingConfigs { debug { storeFile file('pixels-city.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } } }\n"
          open(p,'w').write(s)
          PY
          cat > ks.b64 <<'KS'
          /u3+7QAAAAIAAAABAAAAAQAPYW5kcm9pZGRlYnVna2V5AAABoO4mao8AAAT+MIIE+jAMBgorBgEE
