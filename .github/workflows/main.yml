name: Build Pixel City APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install app dependencies
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build the APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PixelCity.apk

      - name: Save the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: PixelCity-apk
          path: PixelCity.apk

      - name: Publish a download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pixel City build ${{ github.run_number }}
          body: Download PixelCity.apk on your Android phone and open it to install.
          files: PixelCity.apk
